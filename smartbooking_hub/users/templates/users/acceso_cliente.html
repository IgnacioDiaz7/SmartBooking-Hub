<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Cliente | SmartBooking HUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .bg-navy { background-color: #0A2647; }
        .text-navy { color: #0A2647; }
        .btn-naranjo { background-color: #F58220; color: white; border: none; }
        .btn-naranjo:hover { background-color: #e07015; color: white; }
        .nav-tabs .nav-link { color: #6c757d; border: none; border-bottom: 3px solid transparent; font-weight: bold; border-radius: 0; padding: 15px 20px;}
        .nav-tabs .nav-link.active { color: #F58220; background: none; border-bottom: 3px solid #F58220; }
        .nav-tabs .nav-link:hover { border-color: transparent; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} rounded-0 small shadow-sm">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <div class="card border-0 shadow-sm rounded-0">
                    <div class="card-header bg-navy text-white text-center py-4 rounded-0 border-0">
                        <h4 class="mb-0 fw-bold" style="letter-spacing: 1px;">SmartBooking HUB</h4>
                        <p class="small text-white-50 mb-0 mt-1">Portal de Clientes</p>
                    </div>
                    
                    <ul class="nav nav-tabs w-100 d-flex text-center" id="myTab" role="tablist">
                        <li class="nav-item flex-fill" role="presentation">
                            <button class="nav-link w-100 active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Ingresar</button>
                        </li>
                        <li class="nav-item flex-fill" role="presentation">
                            <button class="nav-link w-100" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Crear Cuenta</button>
                        </li>
                    </ul>

                    <div class="card-body p-4 p-md-5">
                        <div class="tab-content" id="myTabContent">
                            
                            <div class="tab-pane fade show active" id="login" role="tabpanel">
                                <form method="POST">
                                    {% csrf_token %}
                                    <input type="hidden" name="action" value="login">
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">CORREO ELECTRÓNICO</label>
                                        <input type="email" name="email" class="form-control rounded-0" placeholder="tu@correo.com" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label small fw-bold text-muted">CONTRASEÑA</label>
                                        <input type="password" name="password" class="form-control rounded-0" placeholder="••••••••" required>
                                    </div>
                                    <button type="submit" class="btn btn-naranjo w-100 fw-bold rounded-0 py-2">INICIAR SESIÓN</button>
                                </form>
                            </div>

                            <div class="tab-pane fade" id="register" role="tabpanel">
                                <form method="POST">
                                    {% csrf_token %}
                                    <input type="hidden" name="action" value="register">
                                    <div class="row g-2 mb-3">
                                        <div class="col-6">
                                            <label class="form-label small fw-bold text-muted">NOMBRE</label>
                                            <input type="text" name="first_name" class="form-control rounded-0" required>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small fw-bold text-muted">APELLIDO</label>
                                            <input type="text" name="last_name" class="form-control rounded-0" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">CORREO ELECTRÓNICO</label>
                                        <input type="email" name="email" class="form-control rounded-0" placeholder="tu@correo.com" required>
                                        <small class="text-muted" style="font-size: 0.7rem;">Usa el correo con el que usualmente agendas tus citas.</small>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label small fw-bold text-muted">CREAR CONTRASEÑA</label>
                                        <input type="password" name="password" class="form-control rounded-0" placeholder="Mínimo 8 caracteres" required minlength="8">
                                    </div>
                                    <button type="submit" class="btn btn-naranjo w-100 fw-bold rounded-0 py-2">REGISTRARME</button>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
